name: release

# The tag is derived from the plugin manifests, never typed a second time:
# merging the version bump is the whole release. Triggered by ci rather than by
# push, so the tag can only ever land on a commit whose matrix went green — and
# `workflow_run` has no path filter, hence the idempotent check below instead of
# "did plugin.json change". Recovering a release that never ran is re-running
# that ci run from the Actions UI: it fires this workflow again.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release

jobs:
  tag:
    # DISARMED until #11. Merging the machinery would otherwise tag v0.1.0 on
    # the spot, and the first run belongs to #11's acceptance — it installs the
    # plugin from the marketplace, which needs that tag to exist. Arming it is
    # deleting the `false &&` line below and nothing else.
    #
    # `branches` above filters workflow_run's head_branch, which for a pull
    # request is the *head* — a fork whose default branch is main produces a ci
    # run matching it. Without the two guards below, that fork's manifest would
    # be tagged onto this repository, and a pushed tag cannot be taken back.
    if: >-
      false &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # the commit ci actually tested, not whatever main points at now
          ref: ${{ github.event.workflow_run.head_sha }}
          # full history: the existing tags are what makes a re-run a no-op
          fetch-depth: 0

      - name: Tag the manifest version
        run: |
          version=$(jq -r .version plugins/*/.claude-plugin/plugin.json | sort -u)
          # One line, and shaped like a tag: jq prints "null" for a manifest
          # without the key, which would otherwise be pushed as `vnull`. The
          # same rule lives in plugins/manifest_test.go, which reddens ci first;
          # this is the last check before an irreversible push.
          if [ "$(printf '%s' "$version" | wc -l)" -ne 0 ] ||
             ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "plugin manifests carry no single tag-shaped version: $version" >&2
            exit 1
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged, nothing to release"
            exit 0
          fi

          git tag "$tag"
          git push origin "$tag"
          echo "released $tag" >> "$GITHUB_STEP_SUMMARY"
