name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # every gate is a Taskfile target, so CI and a local run cannot drift.
  # ubuntu runners ship a docker daemon, so testcontainers needs no extra setup.
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test, "test:integration", vuln, "tidy:check"]
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # go.mod pins the minor; check-latest takes the newest patch of it,
          # otherwise govulncheck reports every stdlib fix since .0
          go-version-file: go.mod
          check-latest: true
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task ${{ matrix.target }}
